        <h1>OrbitKit (DevDock) — Automated AI Skills, MCP Servers &amp; Blender 3D Pipeline for Godot 4</h1>
        <p>
          Mantén todos tus proyectos de Godot 4 actualizados con las últimas AI Skills (<code>.agents/skills</code> y <code>.claude/skills</code>),
          servidores Model Context Protocol (MCP) como Godot GDScript LSP y Context7 (<code>ctx7</code>), y addons con un solo comando.
        </p>
        <h2>Instalación rápida vía NPM</h2>
        <pre><code>npm install -g @francisiv/orbitkit
orbitkit
orbitkit init
orbitkit update --all</code></pre>
        <h2>AI Skills incluidas</h2>
        <ul>
          <li><strong>gdscript-architect</strong>: Arquitectura escalable en GDScript 2.0, señales tipadas y Custom Resources.</li>
          <li><strong>godot4-syntax-guardian</strong>: Previene alucinaciones de código de Godot 3.x en proyectos de Godot 4.x.</li>
          <li><strong>godot-blender-pipeline</strong>: Pipeline de exportación Blender 3D a Godot 4 glTF 2.0 (.glb), colisiones y Skeleton3D.</li>
          <li><strong>godot-shader-wizard</strong>: Creación de shaders CanvasItem, Spatial 3D y partículas en GDShader.</li>
          <li><strong>godot-multiplayer-sync</strong>: Redes autoritativas con MultiplayerSpawner y ENetMultiplayerPeer.</li>
          <li><strong>godot-gut-tester</strong>: Pruebas unitarias automatizadas con GUT (Godot Unit Test).</li>
        </ul>
        <p>Repositorio oficial: <a href="https://github.com/FrancisCuarto/OrbitKit">https://github.com/FrancisCuarto/OrbitKit</a></p>
      </main>
